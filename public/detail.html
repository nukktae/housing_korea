<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listing · Seoul Housing</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --text: #111; --muted: #8e8e93; --soft: #6b7280;
      --card: #fafafa; --card-2: #f3f4f6;
      --accent: #2563eb; --gold: #d97706; --red: #ef4444; --green: #16a34a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    header {
      position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,0.92);
      backdrop-filter: saturate(180%) blur(10px); -webkit-backdrop-filter: saturate(180%) blur(10px);
      padding: 14px 28px; display: flex; align-items: center; gap: 14px;
    }
    header .back {
      color: var(--soft); font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 4px; transition: color 0.15s;
    }
    header .back:hover { color: var(--text); }
    header .src-pill {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; color: #fff;
    }
    header .src-pill.dabang  { background: #2563eb; }
    header .src-pill.zigbang { background: #f97316; }
    header nav { margin-left: auto; display: flex; gap: 18px; }
    header nav a { color: var(--muted); font-size: 13px; font-weight: 500; transition: color 0.15s; }
    header nav a:hover { color: var(--text); }

    main { max-width: 1180px; margin: 0 auto; padding: 12px 28px 56px; }

    /* === Hero === */
    .hero {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      border-radius: 16px; overflow: hidden; background: var(--card); margin-bottom: 28px;
    }
    .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero .empty { height: 100%; display: flex; align-items: center; justify-content: center; color: #c0c0c5; font-size: 14px; }
    .hero .nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.92);
      color: var(--text); border: 0; cursor: pointer; font-size: 17px; line-height: 1; padding: 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .hero .nav:hover { background: #fff; }
    .hero .nav.prev { left: 12px; } .hero .nav.next { right: 12px; }
    .hero .actions-overlay {
      position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 5;
    }
    .hero .icon-btn {
      width: 38px; height: 38px; border-radius: 50%; border: 0;
      background: rgba(255,255,255,0.92); cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center;
      color: #374151; box-shadow: 0 1px 3px rgba(0,0,0,.12);
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    .hero .icon-btn:hover { background: #fff; transform: scale(1.05); }
    .hero .icon-btn svg { display: block; }
    .hero .icon-btn.fav.active { background: #fef3c7; color: var(--gold); }
    .hero .icon-btn.fav.active svg { fill: var(--gold); }
    .hero .icon-btn.del:hover { background: var(--red); color: #fff; }
    .hero .dots {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 5px;
    }
    .hero .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); cursor: pointer; transition: background 0.15s, transform 0.15s; }
    .hero .dot.active { background: #fff; transform: scale(1.4); }

    /* === Two-column layout === */
    .layout {
      display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px;
      align-items: start;
    }
    @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

    /* === Primary column === */
    .primary section { margin-bottom: 28px; }
    .primary h1 {
      font-size: 24px; font-weight: 700; margin: 0 0 6px;
      letter-spacing: -0.015em; line-height: 1.3;
    }
    .primary .addr { color: var(--muted); font-size: 14px; margin-bottom: 0; }

    .section-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--muted); font-weight: 600; margin: 0 0 12px;
    }
    .desc-text {
      color: #2a2a2e; font-size: 14px; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word;
    }

    .options-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .opt {
      font-size: 12px; padding: 5px 11px; border-radius: 999px;
      background: var(--card); color: #4b5563; font-weight: 500;
    }

    .manage-grid { background: var(--card); border-radius: 12px; padding: 16px 18px; }
    .manage-grid .avg { color: var(--soft); font-size: 12px; margin-bottom: 10px; }
    .manage-grid .avg b { color: var(--text); }
    .manage-grid .row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
    .manage-grid .row:last-child { margin-bottom: 0; }
    .manage-grid .row .lbl {
      flex-shrink: 0; width: 36px; font-size: 11px; color: var(--muted); padding-top: 5px; font-weight: 600;
    }
    .manage-grid .row .vals { display: flex; gap: 5px; flex-wrap: wrap; }
    .manage-grid .row .vals .val {
      font-size: 11px; padding: 3px 8px; border-radius: 999px; font-weight: 500;
    }
    .manage-grid .row.inc .val { background: #ecfdf5; color: #047857; }
    .manage-grid .row.exc .val { background: #fef2f2; color: #b91c1c; }

    .subway-list { display: flex; flex-direction: column; gap: 8px; }
    .subway {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border-radius: 10px; padding: 10px 14px;
    }
    .subway .ic { font-size: 16px; }
    .subway .nm { font-size: 13px; font-weight: 600; color: var(--text); }
    .subway .ln { font-size: 11px; color: var(--muted); margin-left: auto; }

    /* === Right rail === */
    .rail { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 14px; }
    .panel { background: var(--card); border-radius: 14px; padding: 18px 20px; }

    .price-panel .big {
      font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1;
    }
    .price-panel .big .deposit { color: var(--soft); font-weight: 500; }
    .price-panel .big .slash { color: var(--soft); font-weight: 500; margin: 0 4px; }
    .price-panel .big .unit { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 6px; }
    .price-panel .maint { color: var(--soft); font-size: 13px; margin-top: 6px; }

    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    .fact .k { font-size: 11px; color: var(--muted); letter-spacing: 0.03em; }
    .fact .v { font-size: 13px; color: var(--text); font-weight: 500; margin-top: 1px; }
    .fact.span2 { grid-column: span 2; }

    .agent-panel .name { font-size: 14px; font-weight: 700; }
    .agent-panel .phone { font-size: 13px; color: var(--soft); margin-top: 2px; }
    .agent-panel .addr  { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    .agent-panel .intro { font-size: 12px; color: var(--soft); margin-top: 10px; line-height: 1.55;
      white-space: pre-wrap; max-height: 6.5em; overflow: hidden; position: relative; }
    .agent-panel .intro.expanded { max-height: none; }
    .agent-panel .more {
      display: block; font-size: 11px; color: var(--accent); margin-top: 6px;
      background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit;
    }

    #map { width: 100%; height: 200px; border-radius: 12px; overflow: hidden; background: var(--card-2); }
    .leaflet-container { background: #f5f5f5; font-family: inherit; }

    .cta {
      display: block; text-align: center; padding: 14px;
      background: var(--text); color: #fff !important;
      border-radius: 12px; font-size: 13px; font-weight: 600;
      letter-spacing: -0.005em; transition: background 0.15s, transform 0.1s;
    }
    .cta:hover { background: #000; }
    .cta:active { transform: scale(0.99); }

    .badges-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
    .badge {
      font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
      background: var(--card-2); color: var(--soft);
    }
    .badge.verified { background: #eff6ff; color: var(--accent); }
    .badge.new      { background: #ecfdf5; color: #047857; }

    .not-found { padding: 100px 24px; text-align: center; color: var(--muted); }
    .not-found h2 { color: var(--text); font-size: 18px; font-weight: 600; margin: 0 0 6px; }
    .not-found a { color: var(--accent); }

    /* === Mobile === */
    @media (max-width: 640px) {
      header { padding: 12px 16px; gap: 10px; }
      header .back { font-size: 12px; }
      header .src-pill { font-size: 10px; padding: 3px 8px; }
      header nav a { font-size: 12px; }

      main { padding: 8px 16px 40px; }

      .hero { border-radius: 14px; margin-bottom: 20px; }
      .hero .nav { width: 32px; height: 32px; font-size: 15px; opacity: 0.85; }
      .hero .nav.prev { left: 8px; } .hero .nav.next { right: 8px; }
      .hero .icon-btn { width: 34px; height: 34px; }
      .hero .icon-btn svg { width: 17px; height: 17px; }
      .hero .actions-overlay { top: 8px; right: 8px; gap: 6px; }
      .hero .dots { bottom: 8px; gap: 4px; }
      .hero .dot { width: 5px; height: 5px; }

      .layout { gap: 20px; }
      .rail { position: static; gap: 12px; }
      .primary section { margin-bottom: 22px; }
      .primary h1 { font-size: 20px; }
      .primary .addr { font-size: 13px; }

      .section-title { font-size: 10px; margin-bottom: 10px; }
      .desc-text { font-size: 13px; line-height: 1.65; }

      .panel { padding: 14px 16px; border-radius: 12px; }
      .price-panel .big { font-size: 24px; }
      .price-panel .big .unit { font-size: 12px; }
      .price-panel .maint { font-size: 12px; }

      .facts { gap: 10px 12px; }
      .fact .k { font-size: 10px; }
      .fact .v { font-size: 12px; }

      .opt { font-size: 11px; padding: 4px 9px; }
      .manage-grid { padding: 14px 14px; }
      .manage-grid .row .lbl { width: 28px; font-size: 10px; }
      .manage-grid .row .vals .val { font-size: 10px; padding: 2px 7px; }

      .subway { padding: 8px 12px; gap: 8px; }
      .subway .nm { font-size: 12px; }
      .subway .ln { font-size: 10px; }

      .agent-panel .name { font-size: 13px; }
      .agent-panel .phone { font-size: 12px; }
      .agent-panel .addr { font-size: 11px; }
      .agent-panel .intro { font-size: 11px; }

      #map { height: 180px; border-radius: 10px; }
      .cta { padding: 12px; font-size: 13px; border-radius: 10px; }
    }
  </style>

<style>
  .pin-gate { position: fixed; inset: 0; z-index: 100000; background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .pin-card { background: #fafafa; border-radius: 18px; padding: 40px 44px 32px;
    text-align: center; max-width: 360px; width: 90%; }
  .pin-card h1 { font-size: 20px; font-weight: 700; margin: 0 0 6px; color: #111; letter-spacing: -0.01em; }
  .pin-card p { font-size: 13px; color: #8e8e93; margin: 0 0 28px; }
  .pin-inputs { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; }
  .pin-inputs input {
    width: 50px; height: 60px; text-align: center; font-size: 24px; font-weight: 600;
    border: 0; background: #fff; border-radius: 12px; outline: 2px solid transparent;
    color: #111; caret-color: #2563eb; font-family: inherit;
    transition: outline-color 0.15s, transform 0.1s;
  }
  .pin-inputs input:focus { outline-color: #2563eb; }
  .pin-inputs.shake { animation: pinShake 0.35s; }
  @keyframes pinShake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
  .pin-card .err { color: #ef4444; font-size: 12px; min-height: 16px; }
</style>
<div class="pin-gate" id="pin-gate">
  <div class="pin-card">
    <h1>비밀번호</h1>
    <p>4자리 코드를 입력하세요</p>
    <div class="pin-inputs" id="pin-inputs">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    </div>
    <div class="err" id="pin-err"></div>
  </div>
</div>
<script>
(function() {
  var KEY = "housing_pin_v1";
  var PIN = "0111";
  function unlock() {
    var g = document.getElementById("pin-gate");
    if (!g) return;
    g.style.transition = "opacity 0.25s";
    g.style.opacity = "0";
    setTimeout(function() { g.remove(); }, 260);
  }
  if (localStorage.getItem(KEY) === "ok") {
    // Already verified — remove gate as soon as it's parsed
    document.addEventListener("DOMContentLoaded", unlock);
    return;
  }
  document.addEventListener("DOMContentLoaded", function() {
    var gate = document.getElementById("pin-gate");
    if (!gate) return;
    var inputs = gate.querySelectorAll(".pin-inputs input");
    var err = document.getElementById("pin-err");
    var box = document.getElementById("pin-inputs");
    inputs[0].focus();
    function check() {
      var v = Array.prototype.map.call(inputs, function(i) { return i.value; }).join("");
      if (v.length !== 4) return;
      if (v === PIN) {
        localStorage.setItem(KEY, "ok");
        unlock();
      } else {
        err.textContent = "코드가 일치하지 않습니다";
        box.classList.add("shake");
        setTimeout(function() {
          box.classList.remove("shake");
          for (var i = 0; i < inputs.length; i++) inputs[i].value = "";
          inputs[0].focus();
        }, 360);
      }
    }
    inputs.forEach(function(input, idx) {
      input.addEventListener("input", function() {
        input.value = (input.value || "").replace(/[^0-9]/g, "");
        if (input.value && idx < 3) inputs[idx + 1].focus();
        check();
      });
      input.addEventListener("keydown", function(e) {
        if (e.key === "Backspace" && !input.value && idx > 0) inputs[idx - 1].focus();
      });
      input.addEventListener("paste", function(e) {
        e.preventDefault();
        var data = ((e.clipboardData || window.clipboardData).getData("text") || "").replace(/[^0-9]/g, "").slice(0, 4);
        if (!data) return;
        for (var i = 0; i < 4; i++) inputs[i].value = data[i] || "";
        if (data.length === 4) check();
        else inputs[data.length].focus();
      });
    });
  });
})();

  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

    async function postAction(id, action, value) {
      const res = await fetch("/action", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ id, action, value })
      });
      return res.json();

    function fmtDate(s) {
      if (!s) return null;
      try { return new Date(s).toLocaleDateString("ko-KR", { year: "numeric", month: "short", day: "numeric" }); }
      catch { return s; }
    }

    function pickArea(d) {
      // Try v3 .area first, then 전용면적/공급면적
      const a = d?.area;
      const exclu = a?.exclusive ?? a?.exclusiveArea ?? a?.private ?? d?.["전용면적"];
      const supp  = a?.supply ?? a?.supplyArea ?? d?.["공급면적"];
      const fmt = (x) => {
        if (!x) return null;
        const p = x.p ?? x.pyeong;
        const m = x.m2 ?? x.m;
        if (p != null && m != null) return `${p}평 (${m}m²)`;
        if (p != null) return `${p}평`;
        if (m != null) return `${m}m²`;
        return null;
      };
      const e = fmt(exclu);
      const s = fmt(supp);
      if (e && s && e !== s) return `${e} 전용 · ${s} 공급`;

          });
        }
        function show(i) { idx = (i + images.length) % images.length; img.src = images[idx]; renderDots(); }
        img.addEventListener("error", () => {
          const failed = images[idx];
          images = images.filter((u) => u !== failed);
          if (!images.length) { img.style.display = "none"; dots.style.display = "none"; return; }
          show(idx % images.length);
        });
        document.querySelector(".hero .prev").addEventListener("click", () => show(idx - 1));
        document.querySelector(".hero .next").addEventListener("click", () => show(idx + 1));
        document.addEventListener("keydown", (e) => {
          if (e.key === "ArrowLeft")  show(idx - 1);
          if (e.key === "ArrowRight") show(idx + 1);
        });
        renderDots();
      }

      // Mini map
      if (r.lat != null && r.lng != null) {
        const smap = L.map("map", { preferCanvas: true, zoomControl: false, attributionControl: false, scrollWheelZoom: false });
        L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { subdomains: "abcd", maxZoom: 19 }).addTo(smap);
        smap.setView([r.lat, r.lng], 16);
        L.circleMarker([r.lat, r.lng], {
          radius: 8, fillColor: r.source === "dabang" ? "#2563eb" : "#f97316",
          color: "#fff", weight: 2.5, fillOpacity: 0.95
        }).addTo(smap);
      }

      // Initial facts from basic row (will get updated by rich data)
      renderFacts(r, null);

      // Hero action buttons
      document.getElementById("btn-fav").addEventListener("click", async (e) => {
        const b = e.currentTarget;
        const was = b.classList.contains("active");
        b.disabled = true;
        await postAction(r.id, "favorite", !was);
        b.classList.toggle("active", !was);
        const svg = b.querySelector("svg"); if (svg) svg.setAttribute("fill", !was ? "#d97706" : "none");
        b.disabled = false;
      });
      document.getElementById("btn-remove").addEventListener("click", async (e) => {
        if (!confirm("이 매물을 목록에서 제거하시겠습니까?")) return;
        e.currentTarget.disabled = true;
        await postAction(r.id, "remove", true);
        location.href = "/";
      });

      // Auto-mark viewed
      if (!r.viewed_at) postAction(r.id, "view", true).catch(() => {});

      // Fetch rich source data
      fetch(`/data/details/${r.id.replace(/[^a-zA-Z0-9_-]/g, "_")}.json`)
        .then((res) => res.json())
        .then((j) => renderRich(r, j))
        .catch(() => {});
    }

    function renderFacts(r, d) {
      const facts = document.getElementById("facts");
      const items = [];
      const py = r.pyeong ? `${r.pyeong}평` : null;
      const area = d ? pickArea(d) : null;
      items.push(["유형", r.type || "—"]);
      items.push(["면적", area || py || "—"]);
      if (d?.roomType?.title || d?.room_type_title) items.push(["방 구조", d.roomType?.title || d.room_type_title]);
      const floorLine = (d?.floor || d?.floor_string) && d?.building_floor
        ? `${d.floor || d.floor_string}층 / 총 ${d.building_floor}층`
        : (d?.floor || d?.floor_string ? `${d.floor || d.floor_string}층` : null);
      if (floorLine) items.push(["층", floorLine]);
      if (d?.roomDirection) items.push(["방향", `${d.roomDirection}향`]);
      if (d?.elevator === true || d?.elevator === false) items.push(["엘리베이터", d.elevator ? "있음" : "없음"]);
      if (d?.parkingAvailableText) items.push(["주차", d.parkingAvailableText]);
      if (d?.moveinDate) items.push(["입주", d.moveinDate]);
      if (d?.reg_date) items.push(["등록일", fmtDate(d.reg_date)]);
      facts.innerHTML = items.filter(([, v]) => v && v !== "—").map(([k, v]) =>
        `<div class="fact"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`
      ).join("");
    }

    function renderRich(r, j) {
      const d = j?.data;
      if (!d) return;

      // Update facts with rich data
      renderFacts(r, d);

      // Description
      if (d.description && d.description.trim()) {
        document.getElementById("sec-desc").style.display = "";
        document.getElementById("desc-text").textContent = d.description;
      }

      // Options
      const opts = Array.isArray(d.options) ? d.options.filter(Boolean) : [];
      if (opts.length) {
        document.getElementById("sec-options").style.display = "";
        document.getElementById("options-row").innerHTML =
          opts.map((o) => `<span class="opt">${esc(o)}</span>`).join("");
      }

      // Manage cost
      if (d.manageCost && ((d.manageCost.includes || []).length || (d.manageCost.notIncludes || []).length)) {
        const wrap = document.getElementById("manage-grid");
        const avg = d.manageCostDetail?.avgManageCost;
        let html = avg != null ? `<div class="avg">실제 평균 <b>${Math.round(avg / 10000)}만원</b></div>` : "";
        if (d.manageCost.includes?.length) {
          html += `<div class="row inc"><div class="lbl">포함</div><div class="vals">${d.manageCost.includes.map((x) => `<span class="val">${esc(x)}</span>`).join("")}</div></div>`;
        }
        if (d.manageCost.notIncludes?.length) {
          html += `<div class="row exc"><div class="lbl">별도</div><div class="vals">${d.manageCost.notIncludes.map((x) => `<span class="val">${esc(x)}</span>`).join("")}</div></div>`;
        }
        wrap.innerHTML = html;
        document.getElementById("sec-manage").style.display = "";
      }

      // Subways
      if (Array.isArray(d._subways) && d._subways.length) {
        document.getElementById("sec-subway").style.display = "";
        document.getElementById("subway-list").innerHTML = d._subways.map((s) =>
          `<div class="subway"><span class="ic">🚇</span><span class="nm">${esc(s.name || "")}</span><span class="ln">${esc(s.description || "")}</span></div>`
        ).join("");
      }

      // Agent (in the right rail)
      if (d._agent) {
        const a = d._agent;
        const ag = document.getElementById("agent-panel");
        let html = `<div class="section-title" style="margin-bottom:10px">중개사</div>`;
        if (a.agentTitle)   html += `<div class="name">${esc(a.agentTitle)}</div>`;
        if (a.agentPhone)   html += `<div class="phone">${esc(a.agentPhone)}</div>`;
        if (a.agentAddress) html += `<div class="addr">${esc(a.agentAddress)}</div>`;
        if (a.agentIntro && a.agentIntro.trim()) {
          const id = "ag-intro-" + Math.random().toString(36).slice(2, 7);
          html += `<div class="intro" id="${id}">${esc(a.agentIntro)}</div>`;
          html += `<button class="more" data-target="${id}">더 보기</button>`;
        }
        ag.innerHTML = html;
        ag.style.display = "";
        ag.querySelector(".more")?.addEventListener("click", (ev) => {
          const t = document.getElementById(ev.currentTarget.dataset.target);
          if (!t) return;
          const expanded = t.classList.toggle("expanded");
          ev.currentTarget.textContent = expanded ? "접기" : "더 보기";
        });
      }

      // Badges in the price panel
      const badges = Array.isArray(d.badges) ? d.badges : [];
      const isNew = d.is_new || badges.includes("NEW");
      const isVerified = badges.includes("ITEM_VERIFICATION");
      if (isNew || isVerified || (d.is_first_movein === true)) {
        const row = document.getElementById("badges-row");
        if (isVerified) row.innerHTML += `<span class="badge verified">✓ 검증된 매물</span>`;
        if (isNew)      row.innerHTML += `<span class="badge new">신규</span>`;
        if (d.is_first_movein === true) row.innerHTML += `<span class="badge new">신축 입주</span>`;
      }
    }

    function showNotFound() {
      document.getElementById("root").innerHTML = `
        <div class="not-found">
          <h2>Listing not found</h2>
          <p>This listing may have been removed. <a href="/">Back to shortlist</a></p>
        </div>`;
    }

    if (!wantedId) {
      showNotFound();
    } else {
      fetch("/data/listings.json").then((r) => r.json()).then((rows) => {
        const row = rows.find((r) => r.id === wantedId);
        if (!row) { showNotFound(); return; }
        render(row);
      });
    }
  </script>
</body>
</html>
